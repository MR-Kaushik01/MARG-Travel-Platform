<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MARG Traveller Login</title><link rel="stylesheet" href="styles.css"></head><body class="auth-page"><div class="auth-card"><a class="brand" href="index.html"><span class="logo">M</span>MARG</a><div class="eyebrow">TRAVELLER ACCOUNT</div><h1>Welcome back.</h1><p>Sign in to your personal MARG travel space.</p><form id="travellerLogin"><label>Email<input id="email" type="email" required></label><label>Password<input id="password" type="password" required></label><button class="btn primary full">Login as Traveller</button></form><div id="msg"></div><p>New traveller? <a href="traveller-register.html">Create an account</a></p><a href="provider-login.html">Are you a service provider? →</a><section id="otpStep" class="otp-step" hidden>
<h2>Verify with OTP</h2>
<p id="otpEmailText">We sent verification codes to your email and phone.</p>
<form id="otpForm">
<input id="otpChallenge" type="hidden">
<label>Email OTP<input id="emailOtp" inputmode="numeric" autocomplete="one-time-code" maxlength="6" pattern="[0-9]{6}" placeholder="6-digit email code" required></label>
<div id="smsOtpWrap"><label>SMS OTP<input id="smsOtp" inputmode="numeric" autocomplete="one-time-code" maxlength="6" pattern="[0-9]{6}" placeholder="6-digit SMS code" required></label></div>
<button class="btn primary full">Verify OTP & Continue</button>
</form>
<button id="resendOtp" class="btn outline full otp-back" type="button">Resend OTP</button>
<button id="backToCredentials" class="btn outline full otp-back" type="button">Back</button>
<div id="otpMsg" class="msg"></div>
</section></div><script src="config.js"></script>
    <script src="auth.js"></script></body></html>
